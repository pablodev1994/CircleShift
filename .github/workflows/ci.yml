name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build, test, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore CircleShift.sln
          dotnet tool restore
      - name: Check formatting
        run: dotnet format CircleShift.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build CircleShift.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CircleShift.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Model and migrations are in sync
        run: dotnet ef migrations has-pending-model-changes --project src/CircleShift.Infrastructure --startup-project src/CircleShift.Api

  web:
    name: Web (lint, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No lockfile is committed yet, so the first install resolves fresh.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm --filter @circleshift/web test:ci
      - run: pnpm web:build

  smoke:
    name: Clean checkout smoke test
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start PostgreSQL and Redis
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Apply migrations
        working-directory: services/api
        env:
          CIRCLESHIFT_POSTGRES: Host=127.0.0.1;Port=5432;Database=circleshift;Username=circleshift;Password=change-me-locally
        run: |
          dotnet tool restore
          dotnet ef database update --project src/CircleShift.Infrastructure --startup-project src/CircleShift.Api
      - name: Readiness reports healthy
        working-directory: services/api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=circleshift;Username=circleshift;Password=change-me-locally
        run: |
          dotnet run --project src/CircleShift.Api --launch-profile http > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1
      - name: Stop services
        if: always()
        run: docker compose down -v
